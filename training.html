<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f1">
  <title>Расписание тренировок — AthleteMenu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css?v=20261113a">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.addEventListener('error', (event) => {
      if (event.target instanceof HTMLScriptElement && event.target.type === 'module') {
        const message = document.querySelector('[data-training-boot-message]');
        if (message) {
          message.textContent = 'Не удалось загрузить сценарий страницы. Обновите страницу или откройте её через локальный сервер.';
          message.closest('[data-training-boot]')?.classList.add('is-error');
        }
      }
    }, true);
  </script>
  <script type="module" src="assets/js/training.js?v=20261113a"></script>
</head>
<body>
  <div data-app-shell>
    <main class="training-boot-fallback" data-training-boot role="status" aria-live="polite">
      <span class="training-boot-mark" aria-hidden="true">✦</span>
      <h1>Расписание тренировок</h1>
      <p data-training-boot-message>Загружаем календарь тренировок…</p>
    </main>
  </div>
</body>
</html>
