<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="Уверенный и энергичный спортсмен">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#123c30"/>
      <stop offset=".56" stop-color="#24654b"/>
      <stop offset="1" stop-color="#0b2c23"/>
    </linearGradient>
    <radialGradient id="sunlight" cx=".68" cy=".36" r=".6">
      <stop stop-color="#b5e0a7" stop-opacity=".72"/>
      <stop offset="1" stop-color="#8fc99a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1=".15" y1="0" x2=".85" y2="1">
      <stop stop-color="#f5c9a5"/>
      <stop offset=".58" stop-color="#e6a77d"/>
      <stop offset="1" stop-color="#c77e5d"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#42b879"/>
      <stop offset=".55" stop-color="#168154"/>
      <stop offset="1" stop-color="#0d5b3d"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#3b302a"/>
      <stop offset="1" stop-color="#171f1b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-.3" y="-.3" width="1.6" height="1.7">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="portrait-clip"><path d="M585 640c9-91 29-161 73-205 33-33 77-47 133-43 63 4 109 31 138 78 26 43 39 102 46 170Z"/></clipPath>
  </defs>
  <rect width="960" height="640" fill="url(#background)"/>
  <rect width="960" height="640" fill="url(#sunlight)"/>
  <circle cx="722" cy="282" r="244" fill="none" stroke="#e1f6dc" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="722" cy="282" r="282" fill="none" stroke="#e1f6dc" stroke-opacity=".08" stroke-width="2"/>
  <path d="M0 515c194-62 331 20 490-17 181-43 307-23 470-82v224H0Z" fill="#08251d" opacity=".58"/>
  <g opacity=".18" fill="none" stroke="#d6f0da" stroke-width="4" stroke-linecap="round">
    <path d="M835 125v76m-24-52h48M882 251v48m-17-32h34"/>
    <circle cx="545" cy="191" r="5" fill="#d6f0da" stroke="none"/>
    <circle cx="858" cy="372" r="4" fill="#d6f0da" stroke="none"/>
  </g>

  <!-- Athletic shoulders and shirt -->
  <path d="M575 640c9-91 29-161 73-205 33-33 77-47 133-43 63 4 109 31 138 78 26 43 39 102 46 170Z" fill="url(#shirt)" filter="url(#soft-shadow)"/>
  <path d="M702 420c2 38 13 61 38 76 26 16 53 16 79-1 23-15 34-40 34-76Z" fill="url(#skin)"/>
  <path d="M727 462c22 24 55 31 83 15 17-10 28-26 34-47l-2 34c-14 36-42 54-76 50-22-3-42-17-54-39Z" fill="#bc7657" opacity=".42"/>
  <path d="M676 476c30 20 67 30 105 30 36 0 72-10 101-30 27 22 44 57 54 101l29 63H557l31-72c17-44 44-74 88-92Z" fill="url(#shirt)"/>
  <path d="M723 480c20 21 43 31 66 31 25 0 49-11 70-32l20 17c-20 42-53 65-91 65-40 0-73-24-91-66Z" fill="#d5f0df" opacity=".22"/>

  <!-- Face, turned slightly toward the viewer -->
