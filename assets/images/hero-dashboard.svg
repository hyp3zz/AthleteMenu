  <ellipse cx="837" cy="297" rx="16" ry="23" fill="#d99570"/>
  <path d="M664 256c8-59 47-94 101-94 57 0 97 41 99 103l-6 69c-4 54-42 98-92 101-53 3-96-38-101-94Z" fill="url(#skin)" filter="url(#soft-shadow)"/>
