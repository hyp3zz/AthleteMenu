  <path d="M751 294c-2 17-8 31-13 41 5 5 12 7 20 5" fill="none" stroke="#bd795c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".78"/>
  <ellipse cx="695" cy="323" rx="16" ry="8" fill="#ee9f83" opacity=".3"/>
  <ellipse cx="808" cy="322" rx="16" ry="8" fill="#ee9f83" opacity=".28"/>
  <path d="M714 351c14 16 39 20 58 10 5-3 9-7 12-11" fill="none" stroke="#995744" stroke-width="5" stroke-linecap="round"/>
  <path d="M723 354c14 8 31 10 45 4" fill="none" stroke="#fff0df" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <path d="M671 319c1 27 7 48 18 63" fill="none" stroke="#ffd8b9" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
  <path d="M833 319c-2 21-8 39-18 53" fill="none" stroke="#a9624d" stroke-opacity=".28" stroke-width="5" stroke-linecap="round"/>

