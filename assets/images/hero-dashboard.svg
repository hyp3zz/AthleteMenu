  <path d="M647 283c-8-50 4-91 31-117 24-23 56-34 91-31 43 3 75 23 91 56 10 20 13 48 7 78l-17-15-12-45c-25 15-56 21-91 19-27-1-49-8-68-18l-18 45Z" fill="url(#hair)"/>
  <path d="M674 209c11-30 37-51 69-57m17 1c22 5 38 16 49 33" fill="none" stroke="#6a5142" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/>
  <!-- Brows and eyes -->
  <path d="M685 276c13-9 29-10 42-3m43-2c14-8 30-7 42 2" fill="none" stroke="#654737" stroke-width="6" stroke-linecap="round"/>
  <path d="M690 292c10 8 24 9 35 1m53-1c11 8 24 8 35 0" fill="none" stroke="#fff8ef" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="709" cy="293" rx="4.5" ry="5.5" fill="#34483e"/>
  <ellipse cx="796" cy="292" rx="4.5" ry="5.5" fill="#34483e"/>
  <circle cx="710" cy="291" r="1.5" fill="#fff"/>
  <circle cx="797" cy="290" r="1.5" fill="#fff"/>
